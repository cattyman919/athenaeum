name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        if: hashFiles('api/go.mod') != ''
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: gofmt
        if: hashFiles('api/go.mod') != ''
        working-directory: api
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        if: hashFiles('api/go.mod') != ''
        working-directory: api
        run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        if: hashFiles('api/go.mod') != ''
        with:
          working-directory: api
      - name: test
        if: hashFiles('api/go.mod') != ''
        working-directory: api
        run: go test ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        if: hashFiles('web/package.json') != ''
        with:
          version: 9
      - uses: actions/setup-node@v4
        if: hashFiles('web/package.json') != ''
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: install
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: lint
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: pnpm lint
      - name: unit
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: pnpm test
      - name: build
        if: hashFiles('web/package.json') != ''
        working-directory: web
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Real Ollama with a cached embedding model; chat + Whisper are stubbed (docs/09 §8.1).
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
      OFFLINE_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: restore ollama model cache
        uses: actions/cache@v4
        with:
          path: .ollama-cache
          key: ollama-nomic-embed-text-v1
      - name: install web deps
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: install chromium
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium
      - name: provision stack (infra, migrate, seed, reindex)
        run: ./scripts/e2e-prepare.sh
      - name: playwright
        working-directory: web
        run: pnpm exec playwright test
      - name: upload playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
      - name: make ollama cache readable by the cache action
        if: always()
        run: sudo chown -R "$USER" .ollama-cache || true
