# Git hooks — docs/09-development.md §9. Install with `lefthook install`.
# Each pre-commit job no-ops when its project has no code yet or the tool is absent.
pre-commit:
  parallel: true
  commands:
    api-fmt:
      glob: "api/**/*.go"
      run: test -f api/go.mod || exit 0; test -z "$(gofmt -l {staged_files})" || { echo "gofmt needed:"; gofmt -l {staged_files}; exit 1; }
    api-lint:
      glob: "api/**/*.go"
      run: test -f api/go.mod || exit 0; command -v golangci-lint >/dev/null || { echo "golangci-lint not installed; skipping"; exit 0; }; cd api && golangci-lint run ./...
    web-lint:
      glob: "web/**/*.{ts,tsx,js,jsx,mjs,css,json}"
      run: test -f web/package.json || exit 0; test -d web/node_modules || { echo "web deps not installed; skipping"; exit 0; }; pnpm -C web lint && pnpm -C web exec prettier --check {staged_files}
commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
